<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLARIS · 太阳系探索系统</title>
<!-- 内联 SVG，省掉一个 favicon.ico 文件，file:// 下双击打开也一样有图标。
     少了它浏览器会去要 /favicon.ico 吃一个 404 —— 这个错在本地看不见，
     只有放到 Pages 上才冒出来（深空底 + 琥珀太阳 + 青色轨道，跟 HUD 同源） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303060d'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.8' fill='none' stroke='%235ee7ff' stroke-width='2.6' transform='rotate(-24 16 16)'/%3E%3Ccircle cx='16' cy='16' r='6.2' fill='%23ffc46b'/%3E%3Ccircle cx='27' cy='11.1' r='2.6' fill='%23cfe6f5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="scene"></canvas>

<!-- 画面叠加的装饰层 -->
<div class="fx-vignette"></div>
<div class="fx-scanlines"></div>

<!-- 左上：标题 -->
<header class="hud-title">
  <div class="title-mark"><span></span></div>
  <div class="title-text">
    <h1>SOLARIS</h1>
    <p>太阳系探索系统 / SOLAR SYSTEM EXPLORER</p>
  </div>
</header>

<!-- 左侧：天体索引 -->
<aside class="hud-left">
  <div class="panel-label" id="list-label"><i></i><span>天体索引 / INDEX</span></div>
  <!-- 这行是给天球壳做的标注，只在恒星模式显示。措辞要准：「从太阳看出去」
       是字面意思 —— 壳上的位置是从原点投影的，而相机永远在原点之外，
       所以内层和壳上那两个副本对不上是必然的，不是画错了 -->
  <div class="list-note" id="list-note" hidden>
    外壳 = 从太阳看出去的投影<br>
    内层 = 真实三维距离
  </div>
  <nav id="planet-list" class="planet-list"></nav>
  <!-- 两处署名都是许可条件，不是可选项。它们只在恒星模式露出来 ——
       太阳系那部分数据是手写的，跟这两家都无关。
       分行的依据是**数据从哪来**，不是「恒星 / 星座」：按真实距离摆的那
       141 颗（左栏标题叫它「邻近恒星」）是 HYG 的，而壳上那 1655 颗和
       88 个星座的连线都是 d3-celestial 的（见 js/sky.js 头部的复现命令，
       两个输入文件同源）。按「恒星 / 星座」分会把壳星那一大块漏在两家
       之外 -->
  <div class="list-credit" id="list-credit" hidden>
    邻近恒星 · HYG Database · CC BY-SA 4.0<br>
    天球壳 · d3-celestial · BSD-3-Clause
  </div>
</aside>

<!-- 右上：控制台 -->
<section class="hud-right">
  <div class="panel-label"><i></i>控制台 / CONTROL</div>

  <div class="ctrl">
    <div class="ctrl-row">
      <span>时间流速</span>
      <span id="speed-value" class="ctrl-value">1.0×</span>
    </div>
    <input type="range" id="speed-range" min="0" max="4" step="0.1" value="1">
  </div>

  <div class="btn-grid">
    <!-- 模式切换横跨整行：它不是四个开关里的第五个，而是换掉整个视野的入口 -->
    <button id="btn-mode" class="hud-btn is-wide">邻近恒星</button>
    <!-- 只在恒星模式露面（applyMode 里切 hidden）。不复用上面那只「轨道线」：
       同一个位置的按钮在两个模式里做不同的事，读代码的人迟早会踩 -->
    <button id="btn-constel" class="hud-btn is-wide is-on" hidden>星座线</button>
    <button id="btn-pause" class="hud-btn"><span class="btn-label">暂停</span></button>
    <button id="btn-orbits" class="hud-btn is-on">轨道线</button>
    <button id="btn-glow" class="hud-btn is-on">辉光</button>
    <button id="btn-reset" class="hud-btn">重置视角</button>
  </div>
</section>

<!-- 右侧：天体档案 -->
<aside id="info" class="info">
  <button id="btn-close-info" class="info-close" aria-label="关闭">✕</button>
  <div id="info-body" class="info-body"></div>
</aside>

<!-- 追踪状态 -->
<button id="follow" class="follow">
  <span class="follow-dot"></span>
  <span class="follow-txt">追踪 <b id="follow-name">—</b></span>
  <span class="follow-x">解除</span>
</button>

<!-- 星座名（恒星模式）。内容由 updateSkyLayer 每帧填，最多八个 -->
<div id="sky-labels" class="sky-labels" hidden></div>

<!-- 悬停名称标签 -->
<div id="tooltip" class="tooltip"></div>

<!-- 底部操作提示 -->
<div class="hud-hint">
  <span><kbd>拖拽</kbd>旋转视角</span>
  <span><kbd>滚轮</kbd>缩放</span>
  <span><kbd>点击天体</kbd>查看档案</span>
  <span><kbd>空格</kbd>暂停</span>
  <span><kbd>Esc</kbd>退出</span>
</div>

<!-- 加载屏 -->
<div id="loading" class="loading">
  <div class="loading-inner">
    <div class="loading-ring"><i></i></div>
    <h2>SOLARIS</h2>
    <p class="loading-sub">正在演算行星地表纹理…</p>
    <div class="loading-track"><div id="loading-bar" class="loading-bar"></div></div>
    <div class="loading-meta">
      <span id="loading-label">初始化</span>
      <span id="loading-pct">0%</span>
    </div>
  </div>
</div>

<!-- 依赖：three.js 及官方扩展（均已本地化，可离线运行） -->
<script src="lib/three.min.js"></script>
<script src="lib/CopyShader.js"></script>
<script src="lib/LuminosityHighPassShader.js"></script>
<script src="lib/Pass.js"></script>
<script src="lib/ShaderPass.js"></script>
<script src="lib/EffectComposer.js"></script>
<script src="lib/RenderPass.js"></script>
<script src="lib/UnrealBloomPass.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/sky.js"></script>
<script src="js/textures.js"></script>
<script src="js/main.js"></script>
</body>
</html>
